name: Daily Life OS Briefing

on:
  schedule:
    - cron: '0 13 * * *'  # 8:00 AM EST (13:00 UTC) every day
  workflow_dispatch:

jobs:
  life-os:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/setup-trading-bot-NISEK

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: life-os/requirements.txt

      - name: Install dependencies
        run: pip install -r life-os/requirements.txt

      - name: Run Life OS briefing
        run: python life-os/life_os.py
